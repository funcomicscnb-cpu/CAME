name: came
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - pyyaml
  - jsonschema
  - pandas
  - numpy
  - scipy
  - openjdk=17
  # Upper bound: Nextflow >=25/26 enables a strict-syntax parser that rejects
  # this repo's classic-DSL2 main.nf idioms. Keep <24 until main.nf is migrated.
  - nextflow>=22.10.0,<24
  - r-base>=4.2
  - r-yaml
  - r-ape
  - r-nlme
  - r-data.table
  - bioconductor-deseq2
  - fastqc
  - star
  - subread
  - bowtie2
  - macs3
  - bwa
  - bwa-mem2
  - samtools
  - gatk4
  - bedtools
  - multiqc
