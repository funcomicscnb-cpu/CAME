name: CAME CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Pin the Nextflow version installed by the `curl get.nextflow.io | bash` jobs.
# Nextflow >=25/26 enables a strict-syntax parser that rejects this repo's
# classic-DSL2 main.nf idioms; 23.10.1 is the last classic-parser line tested.
# Harmless to the conda/Docker jobs (their Nextflow is pinned independently).
env:
  NXF_VER: "23.10.1"

jobs:
  fast-validation:
    name: Fast validation and lightweight regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r environment/requirements.txt

      - name: Install minimal R dependencies
        run: Rscript environment/install_r_packages.R --install-core --skip-deseq2

      - name: Stage 22 packaging checks
        run: |
          python3 bin/print_versions.py
          python3 bin/validate_release_bundle.py
          bash tests/test_release_packaging.sh

      - name: Real-mode unit tests
        run: |
          bash tests/test_real_mode_unit.sh
          python3 tests/test_fixture_harness.py
          bash tests/test_real_mode_fixtures.sh --soft

      - name: Lightweight regression tests
        run: |
          bash tests/test_metadata_validation.sh
          bash tests/test_profile_examples.sh
          bash tests/test_study_profile_validation.sh
          bash tests/test_phenotype_processing.sh
          bash tests/test_phylo_hypothesis.sh
          bash tests/test_bulk_omics.sh
          bash tests/test_differential_omics.sh
          bash tests/test_orthology_projection.sh
          bash tests/test_orthology_reference_bundle.sh
          bash tests/test_reciprocal_best_orthology.sh
          bash tests/test_gra_analysis.sh
          bash tests/test_phenotype_omics_integration.sh
          bash tests/test_candidate_prioritization.sh
          bash tests/test_functional_interpretation.sh
          bash tests/test_final_report.sh

  end-to-end-stub:
    name: End-to-end stub orchestration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r environment/requirements.txt

      - name: Install minimal R dependencies
        run: Rscript environment/install_r_packages.R --install-core --skip-deseq2

      - name: Stage 13 all-run stub test
        run: CAME_STAGE13_SKIP_REGRESSION=true bash tests/test_end_to_end_orchestration.sh

      - name: Reciprocal-best orthology real-mode (mock lift tools)
        run: |
          bash tests/test_reciprocal_best_orthology_nextflow.sh
          bash tests/test_reciprocal_best_orthology_hal.sh

  real-mode-ci:
    name: Real-tool fixture execution
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize evidence directory
        run: |
          evidence_dir="$RUNNER_TEMP/came-real-mode-evidence"
          mkdir -p "$evidence_dir"
          printf 'EVIDENCE_DIR=%s\n' "$evidence_dir" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record source and runner
        run: |
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD > "$EVIDENCE_DIR"/source-sha.txt
          sha256sum environment/conda-linux-64.lock > "$EVIDENCE_DIR"/lock-sha256.txt
          uname -a > "$EVIDENCE_DIR"/runner-uname.txt
          printf '%s\n' "$RUNNER_ARCH" > "$EVIDENCE_DIR"/runner-arch.txt
          docker version > "$EVIDENCE_DIR"/docker-version.txt
          docker info --format '{{.OSType}}/{{.Architecture}}' > "$EVIDENCE_DIR"/docker-architecture.txt

      - name: Build local CAME image
        id: build-image
        run: docker build -t came-test:pr .

      - name: Inspect unpublished local image
        run: |
          docker image inspect came-test:pr > "$EVIDENCE_DIR"/image-inspect.json
          docker image inspect --format 'local_image_id_config_digest={{.Id}} os={{.Os}} architecture={{.Architecture}} registry_repo_digests={{json .RepoDigests}}' came-test:pr > "$EVIDENCE_DIR"/image-identity.txt
          docker run --rm --mount type=bind,src="$EVIDENCE_DIR",dst=/evidence came-test:pr bash -c '
            uname -a > /evidence/container-uname.txt
            sha256sum environment/conda-linux-64.lock tests/test_real_mode_fixtures.sh tests/retain_fixture_evidence.py > /evidence/packaged-source-sha256.txt
          '

      - name: Verify Nextflow in image
        run: |
          docker run --rm came-test:pr nextflow -version 2>&1 | tee "$EVIDENCE_DIR"/nextflow-version.txt

      - name: Verify real-mode tools in image
        run: |
          docker run --rm --mount type=bind,src="$EVIDENCE_DIR",dst=/evidence came-test:pr python3 bin/check_real_mode_tools.py --mode strict --omics-types rnaseq,atacseq,wgs --outdir /evidence/runtime-tools 2>&1 | tee "$EVIDENCE_DIR"/tool-check.log

      - name: Run strict real-mode fixtures
        run: |
          set +e
          docker run --rm --mount type=bind,src="$EVIDENCE_DIR",dst=/evidence came-test:pr bash tests/test_real_mode_fixtures.sh --strict --evidence-dir /evidence 2>&1 | tee "$EVIDENCE_DIR"/fixtures.log
          fixture_status=${PIPESTATUS[0]}
          printf '%s\n' "$fixture_status" > "$EVIDENCE_DIR"/fixture-exit-status.txt
          exit "$fixture_status"

      # Locked-image DESeq2 checks run packaged /came source from the image;
      # only a new evidence subdirectory is mounted. Runs even if fixtures failed.
      - name: Run locked-image DESeq2 and differential/GRA checks
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        run: |
          set +e
          deseq2_dir="$EVIDENCE_DIR/deseq2-locked-image"
          mkdir -p "$deseq2_dir"
          docker run --rm --mount type=bind,src="$deseq2_dir",dst=/evidence came-test:pr bash -c '
            ev=/evidence
            # Root-created files must stay readable by the runner uploader; chmod only this mount.
            trap "chmod -R a+rX \"\$ev\"" EXIT
            sha256sum bin/run_differential_analysis.R bin/run_differential_gra_activity.R \
              tests/test_deseq2_consistency.R tests/fixtures/deseq2_counts.tsv \
              tests/test_differential_omics.sh tests/test_gra_analysis.sh \
              environment/conda-linux-64.lock > "$ev"/packaged-source-sha256.txt
            grep -E "/(r-base|bioconductor-deseq2)-[0-9]" environment/conda-linux-64.lock > "$ev"/locked-r-deseq2.txt
            conda list -n came "^(r-base|bioconductor-deseq2)$" > "$ev"/installed-r-deseq2.txt 2>&1
            overall=0
            run_check() {
              name=$1; shift
              "$@" 2>&1 | tee "$ev/$name.log"
              status=${PIPESTATUS[0]}
              printf "%s\n" "$status" > "$ev/$name-exit-status.txt"
              [ "$status" -eq 0 ] || overall=1
            }
            run_check strict-deseq2 Rscript tests/test_deseq2_consistency.R --evidence-dir "$ev"/strict-deseq2
            run_check differential-omics bash tests/test_differential_omics.sh
            run_check gra-analysis bash tests/test_gra_analysis.sh
            exit "$overall"
          '
          deseq2_status=$?
          printf '%s\n' "$deseq2_status" > "$deseq2_dir"/exit-status.txt
          exit "$deseq2_status"

      - name: Upload compact real-mode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-mode-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/came-real-mode-evidence/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

  deseq2-validation:
    name: Optional DESeq2 differential validation
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Cache Bioconductor packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-bioc-deseq2-${{ runner.os }}-${{ hashFiles('environment/install_r_packages.R') }}
          restore-keys: r-bioc-deseq2-${{ runner.os }}-

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r environment/requirements.txt

      - name: Install R dependencies including DESeq2
        run: Rscript environment/install_r_packages.R --install-core --install-deseq2

      - name: Strict DESeq2 oracle comparisons
        run: Rscript tests/test_deseq2_consistency.R --evidence-dir results/deseq2-validation

      - name: Differential omics test with real DESeq2
        run: bash tests/test_differential_omics.sh

      - name: Retain DESeq2 comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deseq2-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: results/deseq2-validation/
          retention-days: 7
          if-no-files-found: error

  real-mode-smoke:
    name: Optional real-mode smoke inventory
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Stage 15 soft real-mode smoke
        run: bash tests/test_real_mode_smoke.sh --soft

  orthology-real-tools:
    name: Optional orthology real-tool integration
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create self-contained orthology env (python, nextflow, java, liftOver, chainSwap)
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment/orthology_tools.yml
          cache-environment: true

      - name: Preflight — liftover tools required, halliftover soft (not in this env)
        run: |
          nextflow -version
          python3 bin/check_orthology_tools.py --lift-tool liftover --mode strict
          python3 bin/check_orthology_tools.py --lift-tool halliftover --mode soft

      - name: Real-tool reciprocal-best orthology integration
        run: bash tests/test_orthology_real_tools.sh --strict
